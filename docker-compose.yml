services:
  meowsync:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 构建期注入前端变量（VITE_* 打包进 bundle）；
        # 取值自动来自根目录 .env 或 shell 环境
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_REMOTE_TOKEN: ${VITE_REMOTE_TOKEN:-}
        # 显式 opt-in——build arg 不自动回落 DOWNLOAD_TOKEN；
        # 启用登录的部署绝不设此值（bundle 内嵌令牌=向全体访客发口令）。
        # 无登录 LAN 部署需要前端写权限时才显式设置，且接受它对页面访客可见
        VITE_DOWNLOAD_TOKEN: ${VITE_DOWNLOAD_TOKEN:-}
    container_name: meowsync-app
    restart: unless-stopped
    ports:
      # 单进程：API + WS + 静态前端同端口；本分支默认对外 3101。
      # 公网部署：先改 "127.0.0.1:3101:3002" 完成 /auth/setup 再放开——
      # 空 users 表时 setup 端点对任何可达者开放（DEPLOYMENT「公网部署步骤」）
      - "${API_PORT:-3101}:3002"
    environment:
      - NODE_ENV=production
      - API_PORT=3002
      - HOST=0.0.0.0
      # 跨域 + WS Origin 白名单；逗号分隔多来源，改成你的实际域名
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3101}
      # 可选：远程遥控令牌（设置后 ?token= 必填；前端构建需同步设 VITE_REMOTE_TOKEN）
      - REMOTE_TOKEN=${REMOTE_TOKEN:-}
      # 子目录部署：与构建期 VITE_BASE_PATH 同值——服务端入口剥前缀后路由仍按根路径
      - BASE_PATH=${VITE_BASE_PATH:-/}
      # 公网/局域网暴露时必需：/downloads、/playlists、/song-meta、/ai、/uploads、/settings 写接口鉴权令牌
      - DOWNLOAD_TOKEN=${DOWNLOAD_TOKEN:-}
      # 在会改写 Host 的反向代理后部署时才需要设为 1
      - TRUST_PROXY=${TRUST_PROXY:-}
      # 可选：AI 辅助（OpenAI 兼容接口，三项全配才启用；公网部署请同时设 DOWNLOAD_TOKEN）
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-}
      # 可选：B 站登录 Cookie（杜比/Hi-Res 音轨只对登录账号下发，Hi-Res 通常需大会员）
      - BILI_COOKIE=${BILI_COOKIE:-}
      # 可选：QQ 音乐登录 Cookie（uin+qm_keyst；VIP/无损档下发前提，务必小号）
      - QQ_COOKIE=${QQ_COOKIE:-}
      # 可选：YouTube 登录 Cookie（绕匿名 Innertube 反机器人墙；需含 SAPISID 系键才发签名头，务必小号）
      - YT_COOKIE=${YT_COOKIE:-}
      # 数据目录（SQLite + 下载文件）；默认 /app/data，与下方挂载卷一致
      - DATA_DIR=${DATA_DIR:-}
      - DOWNLOAD_DIR=${DOWNLOAD_DIR:-}
    volumes:
      # 命名卷而非 bind mount：容器以 uid 1001 运行，bind mount 宿主机 ./data
      # 属主不对会直接 SQLITE_CANTOPEN / EACCES；命名卷首次挂载时继承镜像内 /app/data 属主
      - meowsync-data:/app/data
    networks:
      - meowsync-network
    healthcheck:
      # busybox wget 不支持 --no-verbose/--tries（unrecognized option 恒失败），改用 Node fetch
      # 端口解析与服务端一致（API_PORT || PORT || 3002），改 API_PORT 时探活仍正确
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.API_PORT||process.env.PORT||3002)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可选：Nginx反向代理（配置文件已内置，见 nginx.conf）
  nginx:
    image: nginx:alpine
    container_name: meowsync-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      meowsync:
        condition: service_healthy  # 等后端 /healthz 就绪再起反代，避免启动期 502
    networks:
      - meowsync-network
    profiles:
      - with-nginx  # 使用 --profile with-nginx 启用

volumes:
  meowsync-data:

networks:
  meowsync-network:
    driver: bridge
