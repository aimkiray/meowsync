services:
  meowsync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meowsync-app
    restart: unless-stopped
    ports:
      - "3002:3002"  # 单进程：API + WS + 静态前端同端口
    environment:
      - NODE_ENV=production
      - API_PORT=3002
      - HOST=0.0.0.0
      # 跨域 + WS Origin 白名单；改成你的实际域名
      - CORS_ORIGINS=http://localhost:3002
      # 可选：远程遥控令牌（设置后 ?token= 必填）
      # - REMOTE_TOKEN=change-me
      # 在会改写 Host 的反向代理后部署时才需要
      # - TRUST_PROXY=1
    networks:
      - meowsync-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可选：Nginx反向代理（配置文件已内置，见 nginx.conf）
  nginx:
    image: nginx:alpine
    container_name: meowsync-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - meowsync
    networks:
      - meowsync-network
    profiles:
      - with-nginx  # 使用 --profile with-nginx 启用

networks:
  meowsync-network:
    driver: bridge
